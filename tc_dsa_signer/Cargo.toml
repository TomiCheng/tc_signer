[package]
name = "tc_dsa_signer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DSA of FIPS 186: domain parameters, keys, FIPS 186-2 and 186-3 group generation, key pair generation and the signer, after Bouncy Castle."
readme = "README.md"
documentation = "https://docs.rs/tc_dsa_signer"
keywords = ["dsa", "fips186", "signature", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
tc_asym_cipher = "0.2.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_digest = "0.1.0"
tc_dsa = { version = "0.1.0", path = "../tc_dsa" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_prime = { version = "0.1.0", features = ["alloc"] }
tc_sha = "0.1.1"
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = "0.10.3"
tc_signer = { version = "0.1.0", path = "../tc_signer" }
