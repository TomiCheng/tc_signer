[package]
name = "tc_dsa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The DSA-family signature contracts, digest signers, k calculators and (r, s) encodings, after Bouncy Castle's IDsa."
readme = "README.md"
documentation = "https://docs.rs/tc_dsa"
keywords = ["dsa", "ecdsa", "signature", "rfc6979", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
tc_asn1 = "0.1.2"
tc_asym_cipher = "0.2.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
tc_signer = { version = "0.1.0", path = "../tc_signer" }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = "0.10.3"
tc_sha = "0.1.1"
